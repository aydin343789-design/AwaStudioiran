<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-opacity="0.3"/>
  
  <!-- Glow behind sound waves -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.25"/>

  <!-- Sound Waves Graphic -->
  <g fill="url(#waveGrad)">
    <!-- Central Sound Waves (Equalizer/Voice Bar Graphic) -->
    <rect x="116" y="216" width="24" height="80" rx="12" />
    <rect x="156" y="176" width="24" height="160" rx="12" />
    <rect x="196" y="126" width="24" height="260" rx="12" />
    <rect x="236" y="96" width="24" height="320" rx="12" />
    <rect x="276" y="146" width="24" height="220" rx="12" />
    <rect x="316" y="186" width="24" height="140" rx="12" />
    <rect x="356" y="226" width="24" height="60" rx="12" />
  </g>

  <!-- Persian Harakat / Accent Dot Sparkles -->
  <circle cx="248" cy="64" r="10" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="396" cy="180" r="8" fill="#c084fc" filter="url(#glow)"/>
</svg>
