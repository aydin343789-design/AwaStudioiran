name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor & Prepare Android Platform
        run: |
          npm install --legacy-peer-deps --save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          if [ -d "android/app/src/main/res" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              cp public/app-logo.png "$dir/ic_launcher.png" || true
              cp public/app-logo.png "$dir/ic_launcher_round.png" || true
              cp public/app-logo.png "$dir/ic_launcher_foreground.png" || true
            done
          fi
          npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvayeIranAzad-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
